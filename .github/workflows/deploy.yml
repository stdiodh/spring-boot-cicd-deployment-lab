name: Deploy to EC2

on:
  push:
    tags:
      - "deploy-v*.*.*"

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/aandi-deployment-runtime-lab
  RELEASE_TAG: ${{ github.ref_name }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
  RELEASE_DIR: /home/${{ secrets.EC2_USERNAME }}/aandi-deployment-runtime-lab
  COMPOSE_VERSION: v5.1.4

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deployment tag
        id: release
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^deploy-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Deployment tag must match deploy-v<major>.<minor>.<patch>."
            exit 1
          fi

          git fetch --no-tags origin \
            "+refs/heads/10-answer:refs/remotes/origin/10-answer"
          if [[ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != "tag" ]]; then
            echo "::error::Deployment tags must be annotated tags."
            exit 1
          fi

          release_sha="$(git rev-list -n 1 "refs/tags/${GITHUB_REF_NAME}")"
          if ! git merge-base --is-ancestor \
            "$release_sha" refs/remotes/origin/10-answer
          then
            echo "::error::Deployment tags must reference a commit contained in 10-answer."
            exit 1
          fi
          printf 'sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Run tests and build executable jar
        run: ./gradlew clean test bootJar

      - name: Check deployment artifact
        run: test -f build/libs/app.jar

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and publish image
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          sha_image="${IMAGE_REPOSITORY}:${RELEASE_SHA}"
          release_image="${IMAGE_REPOSITORY}:${RELEASE_TAG}"

          if docker pull "$sha_image"; then
            existing_revision="$(
              docker image inspect \
                --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
                "$sha_image"
            )"
            if [[ "$existing_revision" != "$RELEASE_SHA" ]]; then
              echo "::error::Existing SHA image has a different revision label."
              exit 1
            fi
            docker tag "$sha_image" "$release_image"
          else
            docker build \
              --build-arg APP_VERSION="$RELEASE_SHA" \
              --build-arg APP_RELEASE="$RELEASE_TAG" \
              --tag "$sha_image" \
              --tag "$release_image" \
              .
            docker push "$sha_image"
          fi
          docker push "$release_image"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      APP_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/aandi-deployment-runtime-lab:${{ needs.publish.outputs.release_sha }}
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Build and validate runtime environment
        env:
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_MYSQL_ROOT_PASSWORD: ${{ secrets.PROD_MYSQL_ROOT_PASSWORD }}
          PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          PROD_MAIL_USERNAME: ${{ secrets.PROD_MAIL_USERNAME }}
          PROD_MAIL_PASSWORD: ${{ secrets.PROD_MAIL_PASSWORD }}
          PROD_GOOGLE_CLIENT_SECRET: ${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
          PROD_DB_USERNAME: ${{ vars.PROD_DB_USERNAME }}
          PROD_MYSQL_DATABASE: ${{ vars.PROD_MYSQL_DATABASE }}
          PROD_GOOGLE_CLIENT_ID: ${{ vars.PROD_GOOGLE_CLIENT_ID }}
          PROD_FRONTEND_URL: ${{ vars.PROD_FRONTEND_URL }}
          PROD_PASSWORD_RESET_URL: ${{ vars.PROD_PASSWORD_RESET_URL }}
          PROD_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS: ${{ vars.PROD_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS }}
        run: |
          set -euo pipefail

          runtime_env="${RUNNER_TEMP}/runtime.env"

          validate_value() {
            local name="$1"
            local value="${!name-}"

            if [[ -z "$value" ]]; then
              echo "::error::Required production setting is missing: ${name}"
              exit 1
            fi

            if [[ "$value" == *$'\r'* || "$value" == *$'\n'* || "$value" == *"'"* ]]; then
              echo "::error::Production setting contains an unsupported character: ${name}"
              exit 1
            fi
          }

          write_value() {
            local key="$1"
            local source_name="$2"
            printf "%s='%s'\n" "$key" "${!source_name}"
          }

          if [[ -z "${PROD_FRONTEND_URL:-}" ]]; then
            PROD_FRONTEND_URL="http://${EC2_HOST}:8080/realtime-demo.html"
          fi
          if [[ -z "${PROD_PASSWORD_RESET_URL:-}" ]]; then
            PROD_PASSWORD_RESET_URL="http://${EC2_HOST}:8080/auth-demo.html"
          fi
          if [[ -z "${PROD_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:-}" ]]; then
            PROD_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS="http://${EC2_HOST}:8080"
          fi

          for name in \
            PROD_DB_PASSWORD \
            PROD_MYSQL_ROOT_PASSWORD \
            PROD_JWT_SECRET \
            PROD_MAIL_USERNAME \
            PROD_MAIL_PASSWORD \
            PROD_GOOGLE_CLIENT_SECRET \
            PROD_DB_USERNAME \
            PROD_MYSQL_DATABASE \
            PROD_GOOGLE_CLIENT_ID \
            PROD_FRONTEND_URL \
            PROD_PASSWORD_RESET_URL \
            PROD_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS
          do
            validate_value "$name"
          done

          if [[ "$PROD_DB_USERNAME" == "root" ]]; then
            echo "::error::PROD_DB_USERNAME must be a dedicated application user."
            exit 1
          fi
          if [[ ! "$PROD_DB_USERNAME" =~ ^[A-Za-z0-9_]+$ ]]; then
            echo "::error::PROD_DB_USERNAME contains an unsupported character."
            exit 1
          fi
          if [[ ! "$PROD_MYSQL_DATABASE" =~ ^[A-Za-z0-9_]+$ ]]; then
            echo "::error::PROD_MYSQL_DATABASE contains an unsupported character."
            exit 1
          fi
          if [[ "$PROD_DB_PASSWORD" == "$PROD_MYSQL_ROOT_PASSWORD" ]]; then
            echo "::error::Application and MySQL root passwords must differ."
            exit 1
          fi
          jwt_secret_bytes="$(printf '%s' "$PROD_JWT_SECRET" | wc -c | tr -d ' ')"
          if (( jwt_secret_bytes < 32 )); then
            echo "::error::PROD_JWT_SECRET must contain at least 32 bytes."
            exit 1
          fi

          validate_value APP_IMAGE

          umask 077
          : > "$runtime_env"
          chmod 600 "$runtime_env"

          {
            printf "APP_IMAGE='%s'\n" "$APP_IMAGE"
            printf "SPRING_PROFILES_ACTIVE='prod'\n"
            printf "DB_URL='jdbc:mysql://mysql:3306/%s?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8'\n" \
              "$PROD_MYSQL_DATABASE"
            write_value DB_USERNAME PROD_DB_USERNAME
            write_value DB_PASSWORD PROD_DB_PASSWORD
            printf "REDIS_HOST='redis'\n"
            printf "REDIS_PORT='6379'\n"
            write_value JWT_SECRET PROD_JWT_SECRET
            printf "JWT_EXPIRATION_MS='3600000'\n"
            printf "MAIL_HOST='smtp.gmail.com'\n"
            printf "MAIL_PORT='587'\n"
            write_value MAIL_USERNAME PROD_MAIL_USERNAME
            write_value MAIL_PASSWORD PROD_MAIL_PASSWORD
            write_value GOOGLE_CLIENT_ID PROD_GOOGLE_CLIENT_ID
            write_value GOOGLE_CLIENT_SECRET PROD_GOOGLE_CLIENT_SECRET
            write_value APP_FRONTEND_URL PROD_FRONTEND_URL
            write_value APP_PASSWORD_RESET_URL PROD_PASSWORD_RESET_URL
            write_value APP_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS PROD_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS
            write_value MYSQL_DATABASE PROD_MYSQL_DATABASE
            write_value MYSQL_USER PROD_DB_USERNAME
            write_value MYSQL_PASSWORD PROD_DB_PASSWORD
            write_value MYSQL_ROOT_PASSWORD PROD_MYSQL_ROOT_PASSWORD
          } > "$runtime_env"

          test -s "$runtime_env"
          test "$(stat -c '%a' "$runtime_env")" = "600"
          env -u APP_IMAGE docker compose \
            --env-file "$runtime_env" \
            -f deploy/compose.prod.yaml \
            config --quiet

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/aandi-ec2.pem
          chmod 600 ~/.ssh/aandi-ec2.pem
          known_hosts_tmp="${RUNNER_TEMP}/known_hosts"
          for attempt in {1..6}; do
            if ssh-keyscan -T 10 -H "$EC2_HOST" > "$known_hosts_tmp" 2>/dev/null && \
              [[ -s "$known_hosts_tmp" ]]
            then
              install -m 600 "$known_hosts_tmp" ~/.ssh/known_hosts
              break
            fi

            if (( attempt == 6 )); then
              echo "::error::EC2 SSH port did not respond after 6 attempts."
              exit 1
            fi
            echo "EC2 SSH port is not ready; retrying (${attempt}/6)."
            sleep 5
          done

      - name: Upload Compose and deployment scripts
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/aandi-ec2.pem \
            "${EC2_USERNAME}@${EC2_HOST}" \
            "mkdir -p '${RELEASE_DIR}/deploy' '${RELEASE_DIR}/scripts'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/aandi-ec2.pem \
            deploy/compose.prod.yaml \
            "${EC2_USERNAME}@${EC2_HOST}:${RELEASE_DIR}/deploy/compose.prod.yaml"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/aandi-ec2.pem \
            scripts/ensure-compose.sh scripts/deploy.sh scripts/check-deploy.sh \
            "${EC2_USERNAME}@${EC2_HOST}:${RELEASE_DIR}/scripts/"

      - name: Prepare Docker access and Compose plugin
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/aandi-ec2.pem \
            "${EC2_USERNAME}@${EC2_HOST}" \
            "bash -s -- '${RELEASE_DIR}' '${COMPOSE_VERSION}'" <<'REMOTE'
          set -euo pipefail

          release_dir="$1"
          compose_version="$2"
          deployment_user="$(id -un)"

          cd "$release_dir"
          bash scripts/ensure-compose.sh "$compose_version"

          if docker info >/dev/null 2>&1; then
            exit 0
          fi

          if ! sudo -n docker info >/dev/null 2>&1; then
            echo \
              "Docker daemon is unavailable or the deployment user has no passwordless sudo." \
              >&2
            exit 1
          fi

          sudo -n usermod -aG docker "$deployment_user"
          id -nG "$deployment_user" |
            tr ' ' '\n' |
            grep -Fxq docker
          echo "Docker group access configured for the next SSH session."
          REMOTE

      - name: Upload runtime environment
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/aandi-ec2.pem \
            "${EC2_USERNAME}@${EC2_HOST}" \
            "install -m 600 /dev/null '${RELEASE_DIR}/.env.next'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/aandi-ec2.pem \
            "${RUNNER_TEMP}/runtime.env" \
            "${EC2_USERNAME}@${EC2_HOST}:${RELEASE_DIR}/.env.next"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/aandi-ec2.pem \
            "${EC2_USERNAME}@${EC2_HOST}" \
            "test \"\$(stat -c '%a' '${RELEASE_DIR}/.env.next')\" = '600'"

      - name: Install runtime environment and deploy exact image
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/aandi-ec2.pem \
            "${EC2_USERNAME}@${EC2_HOST}" \
            "bash -s -- '${RELEASE_DIR}' '${APP_IMAGE}'" <<'REMOTE'
          set -euo pipefail

          release_dir="$1"
          app_image="$2"

          cd "$release_dir"
          docker info >/dev/null
          test -f .env.next
          chmod 600 .env.next
          grep -Fxq "APP_IMAGE='${app_image}'" .env.next
          env -u APP_IMAGE docker compose \
            --env-file .env.next \
            -f deploy/compose.prod.yaml \
            config --quiet

          if [[ -f .env ]]; then
            cp -p .env .env.previous
            chmod 600 .env.previous
          fi

          mv .env.next .env
          chmod 600 .env
          bash scripts/deploy.sh "$release_dir" "$app_image"
          REMOTE

  verify:
    needs:
      - publish
      - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/aandi-deployment-runtime-lab:${{ needs.publish.outputs.release_sha }}
      RELEASE_SHA: ${{ needs.publish.outputs.release_sha }}
    steps:
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/aandi-ec2.pem
          chmod 600 ~/.ssh/aandi-ec2.pem
          known_hosts_tmp="${RUNNER_TEMP}/known_hosts"
          for attempt in {1..6}; do
            if ssh-keyscan -T 10 -H "$EC2_HOST" > "$known_hosts_tmp" 2>/dev/null && \
              [[ -s "$known_hosts_tmp" ]]
            then
              install -m 600 "$known_hosts_tmp" ~/.ssh/known_hosts
              break
            fi

            if (( attempt == 6 )); then
              echo "::error::EC2 SSH port did not respond after 6 attempts."
              exit 1
            fi
            echo "EC2 SSH port is not ready; retrying (${attempt}/6)."
            sleep 5
          done

      - name: Verify exact image and readiness
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/aandi-ec2.pem \
            "${EC2_USERNAME}@${EC2_HOST}" \
            "bash -s -- '${APP_IMAGE}' '${RELEASE_SHA}'" <<'REMOTE'
          set -euo pipefail

          expected_image="$1"
          expected_revision="$2"
          actual_image="$(docker inspect --format '{{.Config.Image}}' aandi-app)"
          actual_revision="$(
            docker inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              aandi-app
          )"

          test "$actual_image" = "$expected_image"
          test "$actual_revision" = "$expected_revision"
          curl --fail --silent --show-error \
            --connect-timeout 2 \
            --max-time 5 \
            --retry 23 \
            --retry-all-errors \
            --retry-delay 5 \
            --retry-max-time 120 \
            http://localhost:8080/actuator/health/readiness >/dev/null
          REMOTE
