<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 55 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Source에서 Spring Boot process까지의 빌드와 실행 순서</title>
  <desc id="desc">서비스·정책 레이어의 Source code에서 빌드·실행 레이어의 jar와 Docker image를 만들고, image로 container를 생성해 그 안에서 Spring Boot process를 실행하며 환경 설정은 container 시작 시 주입되는 중첩 구조</desc>
  <metadata>Source: A&amp;I Sequence 09 theory, implementation, checklist. License: repository policy; no standalone license grant.</metadata>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#2955E4"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;fill:#111B3F}
      .stage{fill:#FFFFFF;stroke:#94A3B8;stroke-width:2;stroke-dasharray:8 6}
      .node{stroke-width:3}
      .layer-outside{fill:#F1F5F9;stroke:#5B677A}
      .layer-interface{fill:#E6F4F7;stroke:#0E7490}
      .layer-application{fill:#F2EDFF;stroke:#6D43A8}
      .layer-resource{fill:#EAF5EE;stroke:#2C7352}
      .layer-integration{fill:#FFF4D6;stroke:#926000}
      .layer-runtime{fill:#EEF2F7;stroke:#52627A}
      [data-layer="outside"] .layer{fill:#5B677A}
      [data-layer="resource"] .layer{fill:#2C7352}
      .flow{fill:none;stroke:#2955E4;stroke-width:4;marker-end:url(#arrow)}
      .stage-name{font-size:25px;font-weight:850;fill:#0C2691}
      .layer{font-size:25px;font-weight:850;fill:#4B587C;text-anchor:middle}
      .step{font-size:27px;font-weight:900;fill:#0C2691;text-anchor:middle}
      .name{font-size:27px;font-weight:850;text-anchor:middle}
      .body{font-size:25px;font-weight:650;fill:#4B587C;text-anchor:middle}
    </style>
  </defs>
  <rect width="720" height="520" rx="22" fill="#F8F9FB"/>
  <g data-semantic="stage">
    <rect x="19" y="70" width="389" height="230" rx="16" class="stage"/>
    <text x="38" y="101" class="stage-name">빌드 · 서비스 → 런타임 산출물</text>
  </g>
  <g data-layer="application">
    <rect x="32" y="122" width="108" height="140" rx="13" class="node layer-application"/>
    <text x="86" y="148" class="step">1</text>
    <text x="86" y="190" class="name">소스</text>
    <text x="86" y="226" class="body">code</text>
  </g>
  <path d="M140 192H156" class="flow"/>
  <g data-layer="runtime">
    <rect x="163" y="122" width="108" height="140" rx="13" class="node layer-runtime"/>
    <text x="217" y="148" class="step">2</text>
    <text x="217" y="190" class="name">JAR</text>
    <text x="217" y="226" class="body">실행 파일</text>
  </g>
  <path d="M271 192H287" class="flow"/>
  <g data-layer="runtime">
    <rect x="294" y="122" width="100" height="140" rx="13" class="node layer-runtime"/>
    <text x="344" y="148" class="step">3</text>
    <text x="344" y="190" class="name">이미지</text>
    <text x="344" y="226" class="body">Docker</text>
  </g>

  <g data-semantic="stage">
    <rect x="426" y="70" width="275" height="330" rx="16" class="stage"/>
    <text x="446" y="101" class="stage-name">런타임 · 포함 관계</text>
  </g>
  <path d="M394 192H438" class="flow"/>
  <g data-layer="runtime">
    <rect x="445" y="120" width="238" height="168" rx="15" class="node layer-runtime"/>
    <text x="564" y="153" class="step">4 · Container</text>
    <text x="564" y="183" class="layer">런타임 경계</text>
    <g data-layer="runtime">
      <rect x="459" y="194" width="210" height="82" rx="11" class="node layer-runtime"/>
      <text x="481" y="248" class="step">5</text>
      <text x="574" y="232" class="name">Spring Boot</text>
      <text x="574" y="264" class="body">process</text>
    </g>
  </g>
  <g data-layer="runtime">
    <rect x="445" y="310" width="238" height="70" rx="12" class="node layer-runtime"/>
    <text x="564" y="354" class="name">ENV / CONFIG</text>
  </g>
  <path d="M564 310V294" class="flow"/>
</svg>
