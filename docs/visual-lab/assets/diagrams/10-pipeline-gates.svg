<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 52 720 398" role="img" aria-labelledby="title desc">
  <title id="title">build, deploy, verify 파이프라인 게이트</title>
  <desc id="desc">빌드·실행 레이어의 build job과 release bundle, deploy script와 container 갱신을 거쳐, runtime 출력 관찰과 시스템 밖 curl client에서 입구·출구 HTTP endpoint로 보낸 요청이 마지막 gate를 판정하는 흐름</desc>
  <metadata>Source: A&amp;I Sequence 10 theory, implementation, checklist, scripts/check-deploy.sh. License: repository policy; no standalone license grant.</metadata>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#2955E4"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;fill:#111B3F}
      .stage{fill:#FFFFFF;stroke:#94A3B8;stroke-width:2.5}
      .node{stroke-width:2.5}
      .layer-outside{fill:#F1F5F9;stroke:#5B677A}
      .layer-interface{fill:#E6F4F7;stroke:#0E7490}
      .layer-application{fill:#F2EDFF;stroke:#6D43A8}
      .layer-resource{fill:#EAF5EE;stroke:#2C7352}
      .layer-integration{fill:#FFF4D6;stroke:#926000}
      .layer-runtime{fill:#EEF2F7;stroke:#52627A}
      [data-layer="outside"] .layer{fill:#5B677A}
      [data-layer="resource"] .layer{fill:#2C7352}
      .flow{fill:none;stroke:#2955E4;stroke-width:4;marker-end:url(#arrow)}
      .inner-flow{fill:none;stroke:#2955E4;stroke-width:3;marker-end:url(#arrow)}
      .stage-name{font-size:27px;font-weight:900;fill:#0C2691;text-anchor:middle}
      .layer,.layer-band{font-size:25px;font-weight:850;fill:#4B587C;text-anchor:middle}
      .name{font-size:26px;font-weight:850;text-anchor:middle}
      .body{font-size:25px;font-weight:650;fill:#4B587C;text-anchor:middle}
    </style>
  </defs>
  <rect width="720" height="540" rx="22" fill="#F8F9FB"/>
  <g data-semantic="stage">
    <rect x="19" y="72" width="214" height="358" rx="16" class="stage"/>
    <text x="126" y="108" class="stage-name">1 · 빌드</text>
    <text x="126" y="144" class="layer-band">빌드·실행</text>
  </g>
  <g data-layer="runtime">
    <rect x="39" y="160" width="174" height="94" rx="12" class="node layer-runtime"/>
    <text x="126" y="195" class="name">Build job</text>
    <text x="126" y="229" class="body">test → bootJar</text>
  </g>
  <path d="M126 254v20" class="inner-flow"/>
  <g data-layer="runtime">
    <rect x="39" y="280" width="174" height="94" rx="12" class="node layer-runtime"/>
    <text x="126" y="315" class="name">release</text>
    <text x="126" y="349" class="body">bundle 산출물</text>
  </g>

  <path d="M233 251h13" class="flow"/>
  <g data-semantic="stage">
    <rect x="253" y="72" width="214" height="358" rx="16" class="stage"/>
    <text x="360" y="108" class="stage-name">2 · 배포</text>
    <text x="360" y="144" class="layer-band">빌드·실행</text>
  </g>
  <g data-layer="runtime">
    <rect x="273" y="160" width="174" height="94" rx="12" class="node layer-runtime"/>
    <text x="360" y="195" class="name">deploy.sh</text>
    <text x="360" y="229" class="body">release 배치</text>
  </g>
  <path d="M360 254v20" class="inner-flow"/>
  <g data-layer="runtime">
    <rect x="273" y="280" width="174" height="94" rx="12" class="node layer-runtime"/>
    <text x="360" y="315" class="name">Container</text>
    <text x="360" y="349" class="body">server 갱신</text>
  </g>

  <path d="M467 251h13" class="flow"/>
  <g data-semantic="stage">
    <rect x="487" y="72" width="214" height="358" rx="16" class="stage"/>
    <text x="594" y="108" class="stage-name">3 · 검증</text>
  </g>
  <g data-layer="runtime">
    <rect x="507" y="124" width="174" height="94" rx="11" class="node layer-runtime"/>
    <text x="594" y="157" class="layer">빌드·실행</text>
    <text x="594" y="194" class="name">ps · log 출력</text>
  </g>
  <g data-layer="outside">
    <rect x="507" y="236" width="174" height="82" rx="11" class="node layer-outside"/>
    <text x="594" y="264" class="layer">시스템 밖</text>
    <text x="594" y="300" class="name">curl --fail</text>
  </g>
  <path d="M594 318v14" class="inner-flow"/>
  <g data-layer="interface">
    <rect x="507" y="338" width="174" height="82" rx="11" class="node layer-interface"/>
    <text x="594" y="366" class="layer">입구·출구</text>
    <text x="594" y="402" class="name">HTTP API</text>
  </g>
</svg>
