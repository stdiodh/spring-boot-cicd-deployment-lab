<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="title desc">
  <title id="title">build, deploy, verify 파이프라인 게이트</title>
  <desc id="desc">빌드·실행 레이어의 build job과 release bundle, deploy script와 container 갱신을 거쳐, runtime 출력 관찰과 시스템 밖 curl client에서 입구·출구 HTTP endpoint로 보낸 요청이 마지막 gate를 판정하는 흐름</desc>
  <metadata>Source: A&amp;I Sequence 10 theory, implementation, checklist, scripts/check-deploy.sh. License: repository policy; no standalone license grant.</metadata>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#2955E4"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;fill:#111B3F}
      .stage{fill:#FFFFFF;stroke:#94A3B8;stroke-width:2.5}
      .node{stroke-width:2.5}
      .layer-outside{fill:#F1F5F9;stroke:#5B677A}
      .layer-interface{fill:#E6F4F7;stroke:#0E7490}
      .layer-application{fill:#F2EDFF;stroke:#6D43A8}
      .layer-resource{fill:#EAF5EE;stroke:#2C7352}
      .layer-integration{fill:#FFF4D6;stroke:#926000}
      .layer-runtime{fill:#EEF2F7;stroke:#52627A}
      [data-layer="outside"] .layer{fill:#5B677A}
      [data-layer="resource"] .layer{fill:#2C7352}
      .flow{fill:none;stroke:#2955E4;stroke-width:4;marker-end:url(#arrow)}
      .inner-flow{fill:none;stroke:#2955E4;stroke-width:3;marker-end:url(#arrow)}
      .title{font-size:30px;font-weight:850}
      .stage-name{font-size:24px;font-weight:900;fill:#0C2691;text-anchor:middle}
      .layer{font-size:24px;font-weight:850;fill:#4B587C;text-anchor:middle}
      .name{font-size:24px;font-weight:850;text-anchor:middle}
      .body{font-size:24px;font-weight:650;fill:#4B587C;text-anchor:middle}
      .note{font-size:24px;font-weight:800;fill:#FFFFFF;text-anchor:middle}
    </style>
  </defs>
  <rect width="720" height="540" rx="22" fill="#F8F9FB"/>
  <text x="22" y="44" class="title">배포 파이프라인의 세 판단 지점</text>

  <g data-semantic="stage">
    <rect x="18" y="72" width="214" height="358" rx="16" class="stage"/>
    <text x="125" y="108" class="stage-name">1 · 빌드</text>
  </g>
  <g data-layer="runtime">
    <rect x="38" y="128" width="174" height="112" rx="12" class="node layer-runtime"/>
    <text x="125" y="153" class="layer">빌드·실행</text>
    <text x="125" y="184" class="name">Build job</text>
    <text x="125" y="215" class="body">test → bootJar</text>
  </g>
  <path d="M125 240v24" class="inner-flow"/>
  <g data-layer="runtime">
    <rect x="38" y="270" width="174" height="104" rx="12" class="node layer-runtime"/>
    <text x="125" y="295" class="layer">빌드·실행</text>
    <text x="125" y="326" class="name">release</text>
    <text x="125" y="354" class="body">bundle 산출물</text>
  </g>

  <path d="M232 250h20" class="flow"/>
  <g data-semantic="stage">
    <rect x="257" y="72" width="206" height="358" rx="16" class="stage"/>
    <text x="360" y="108" class="stage-name">2 · 배포</text>
  </g>
  <g data-layer="runtime">
    <rect x="277" y="128" width="166" height="112" rx="12" class="node layer-runtime"/>
    <text x="360" y="153" class="layer">빌드·실행</text>
    <text x="360" y="184" class="name">deploy.sh</text>
    <text x="360" y="215" class="body">release 배치</text>
  </g>
  <path d="M360 240v24" class="inner-flow"/>
  <g data-layer="runtime">
    <rect x="277" y="270" width="166" height="104" rx="12" class="node layer-runtime"/>
    <text x="360" y="295" class="layer">빌드·실행</text>
    <text x="360" y="326" class="name">Container</text>
    <text x="360" y="354" class="body">server에서 갱신</text>
  </g>

  <path d="M463 250h20" class="flow"/>
  <g data-semantic="stage">
    <rect x="488" y="72" width="214" height="358" rx="16" class="stage"/>
    <text x="595" y="108" class="stage-name">3 · 검증</text>
  </g>
  <g data-layer="runtime">
    <rect x="508" y="124" width="174" height="82" rx="11" class="node layer-runtime"/>
    <text x="595" y="149" class="layer">빌드·실행</text>
    <text x="595" y="180" class="name">ps · log 출력</text>
  </g>
  <g data-layer="outside">
    <rect x="508" y="224" width="174" height="72" rx="11" class="node layer-outside"/>
    <text x="595" y="248" class="layer">시스템 밖</text>
    <text x="595" y="278" class="name">curl --fail</text>
  </g>
  <path d="M595 296v18" class="inner-flow"/>
  <g data-layer="interface">
    <rect x="508" y="320" width="174" height="72" rx="11" class="node layer-interface"/>
    <text x="595" y="344" class="layer">입구·출구</text>
    <text x="595" y="375" class="name">HTTP API</text>
  </g>

  <g data-semantic="evidence">
    <rect x="18" y="454" width="684" height="66" rx="13" fill="#111B3F"/>
    <text x="360" y="481" class="note">ps·log는 출력만 관찰 · 내용 자동 판정 없음</text>
    <text x="360" y="508" class="note">curl --fail HTTP 성공이 최종 gate</text>
  </g>
</svg>
